<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ancrage — démo locale</title>
  <link rel="stylesheet" href="/demo.css">
</head>
<body>
  <main class="demo-shell">
    <header class="demo-header"><a href="/">ANCRAGE</a><span>Démo locale</span></header>
    <section class="demo-intro"><p class="eyebrow">Essai opérateur</p><h1>Tester un établissement</h1><p>Choisissez l’établissement à rechercher.</p></section>
    <form id="demo-form" class="demo-form">
      <label class="autocomplete-field">Nom de l’établissement<input name="name" required maxlength="160" autocomplete="off" placeholder="Commencer à taper" aria-autocomplete="list" aria-controls="establishment-options" aria-expanded="false"><div id="establishment-options" class="suggestions" role="listbox" hidden></div></label>
      <button class="fallback-toggle" type="button" id="manual-toggle" aria-expanded="false">Mon établissement n’est pas présent</button>
      <section id="manual-panel" class="manual-panel" hidden>
        <label>Adresse<input name="addressLine1" autocomplete="street-address"></label>
        <label>Complément d’adresse<input name="addressLine2" autocomplete="address-line2"></label>
        <div class="field-grid"><label>Code postal<input name="postalCode" autocomplete="postal-code"></label><label>Pays<select name="countryCode" autocomplete="country"><option value="">Sélectionner</option><option value="FR">France</option><option value="LK">Sri Lanka</option></select></label></div>
        <label class="autocomplete-field">Ville<input name="cityLabel" required disabled autocomplete="off" placeholder="Commencer à taper" aria-autocomplete="list" aria-controls="city-options" aria-expanded="false"><div id="city-options" class="suggestions" role="listbox" hidden></div></label>
      </section>
      <button type="submit">Lancer l’audit</button>
      <p id="demo-state" role="status" aria-live="polite"></p>
    </form>
    <section id="demo-result" class="demo-result" hidden></section>
    <section id="public-flow" class="public-flow" hidden>
      <p id="public-flow-state" role="status" aria-live="polite" hidden></p>
      <div id="final-progress" class="report-progress" hidden aria-live="polite">
        <div class="report-progress-track"><div id="final-progress-fill" class="report-progress-fill"></div></div>
        <p id="final-progress-label">Rapport final en préparation.</p>
      </div>
      <div id="public-reports"></div>
      <form id="preparation-form" hidden>
        <label>Votre e-mail<input name="email" type="email" autocomplete="email" required></label>
        <button type="submit">Préparer mon site</button>
      </form>
      <form id="intake-form" hidden>
        <label>Adresse<input name="address" autocomplete="street-address"></label>
        <label>Contact<input name="contact" autocomplete="email"></label>
        <label>Histoire<textarea name="story" rows="3"></textarea></label>
        <label>Menu et prix<textarea name="menu" rows="4" placeholder="Un plat — 14 €"></textarea></label>
        <label>Langue de publication<select name="locale"><option value="fr-FR">Français</option><option value="en">English</option></select></label>
        <fieldset><legend>Photos</legend>
          <label>Façade<input name="photo-facade" type="file" accept="image/jpeg,image/png,image/webp" required></label>
          <label>Plat signature 1<input name="photo-signature-dish-1" type="file" accept="image/jpeg,image/png,image/webp" required></label>
          <label>Plat signature 2<input name="photo-signature-dish-2" type="file" accept="image/jpeg,image/png,image/webp" required></label>
          <label>Intérieur ou terrasse<input name="photo-interior-or-terrace" type="file" accept="image/jpeg,image/png,image/webp" required></label>
          <label>Équipe ou service<input name="photo-team-or-service" type="file" accept="image/jpeg,image/png,image/webp" required></label>
        </fieldset>
        <label><input name="rights" type="checkbox" required> Je dispose des droits nécessaires sur ces photos.</label>
        <button type="submit">Lancer la création de la démo</button>
      </form>
      <div id="public-demo" hidden></div>
    </section>
  </main>
  <script type="module" src="/demo.mjs"></script>
</body>
</html>
